.loading{

}

.error{

 border-radius:13px;

}

.ad{
 min-height:60px;
 display:flex;
 justify-content:center;

}

.footer{
 text-align:center;
 color:#94a3b8;

<body>

<header class="header">

<main class="main">

<section class="hero">

</div>

<h1>
Check Your Fees
</h1>

<p>
Apni coaching class search karein aur<br>
apni fees details aasani se check karein.
</p>

</section>


<div class="searchBox">

<label class="label">
Class Name
</label>

<div class="searchRow">

<input
id="classSearch"
type="search"
placeholder="Class ka naam likhein..."
autocomplete="off">

<button id="searchBtn">
Search
</button>

</div>

</div>


<div
class="results"
id="results">

</div>


<div class="ad">

<script>
atOptions = {

};
</script>

<script src="https://www.highrevenueformat.com/635d4ad3bf4bbbc0e74b26c08d4f41ad/invoke.js"></script>

</div>


<div class="footer">
Fees Management System
</div>

</main>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getDatabase,
 ref,
 get
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig={

apiKey:
"AIzaSyB4jh232r8NiNn3Z76pjsqZdJhOJjw5aN0",

authDomain:
"rajwada-coaching-classes.firebaseapp.com",

databaseURL:
"https://rajwada-coaching-classes-default-rtdb.firebaseio.com",

projectId:
"rajwada-coaching-classes",

storageBucket:
"rajwada-coaching-classes.firebasestorage.app",

messagingSenderId:
"370606048179",

appId:
"1:370606048179:web:89c5f886ec35f1971c01c6",

measurementId:
"G-4XL4VCPY1W"

};


const app=
initializeApp(
firebaseConfig
);

const db=
getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const input=
document.getElementById(
"classSearch"
);

const button=
document.getElementById(
"searchBtn"
);

const results=
document.getElementById(
"results"
);


/* =========================
   SAFE
========================= */

function safe(value){

return String(
value??""
)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================
   SEARCH
========================= */

async function searchClasses(){

const text=
input.value
.trim()
.toLowerCase();


if(!text){

results.innerHTML=`

<div class="empty">
🔍 Class ka naam enter karein.
</div>

`;

return;

}


button.disabled=true;
button.textContent="Searching...";


results.innerHTML=`

<div class="loading">
🔎 Classes search ho rahi hain...
</div>

`;


try{

const snapshot=
await get(
ref(db,"classes")
);


if(!snapshot.exists()){

results.innerHTML=`

<div class="empty">
😔 Abhi koi class available nahi hai.
</div>

`;

button.disabled=false;
button.textContent="Search";

return;

}


const classes=
snapshot.val();

const found=[];


Object.entries(classes)
.forEach(
([id,data])=>{

const profile=
data.profile||data;


const name=
profile.className||
profile.name||
"";


if(
name
.toLowerCase()
.includes(text)
){

found.push({

id:id,

name:name,

owner:
profile.ownerName||
profile.owner||
"",

mobile:
profile.mobile||
profile.phone||
"",

address:
profile.address||
""

});

}

});


if(!found.length){

results.innerHTML=`

<div class="empty">

😔 Class nahi mili.

<br><br>

Class ka naam dobara check karein.

</div>

`;

button.disabled=false;
button.textContent="Search";

return;

}


/* =========================
   RESULTS
========================= */

results.innerHTML=
found
.map(
item=>`

<div
class="classCard"
data-id="${safe(item.id)}">

<div class="classLogo">

${safe(
item.name
.charAt(0)
.toUpperCase()
)}

</div>

<div class="classInfo">

<h3>
${safe(item.name)}
</h3>

<p>
${
item.owner
?
"👤 "+safe(item.owner)
:
"Coaching Class"
}
</p>

</div>

<div class="arrow">
›
</div>

</div>

`
)
.join("");


/* =========================
   CLICK
========================= */

document
.querySelectorAll(".classCard")
.forEach(
card=>{

card.onclick=()=>{

const id=
card.dataset.id;


localStorage.setItem(
"studentClassId",
id
);


const selected=
found.find(
x=>x.id===id
);


if(selected){

localStorage.setItem(
"studentClassName",
selected.name
);

localStorage.setItem(
"studentClassMobile",
selected.mobile
);

}


/*
  Next page:
  Student Name Search
*/

location.href=
"student.html";

};

});


}catch(error){

console.error(error);

results.innerHTML=`

<div class="error">

❌ Search failed.

<br>

${safe(error.message)}

</div>

`;

}


button.disabled=false;
button.textContent="Search";

}


/* =========================
   EVENTS
========================= */

button.onclick=
searchClasses;


input.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter"
){

searchClasses();

}

});


/* =========================
   START
========================= */

results.innerHTML=`

<div class="empty">

🔍 Upar apni class ka naam search karein.

</div>

`;

</script>

</body>
</html>
